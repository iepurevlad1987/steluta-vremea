name: Agenda APK

on:
  push:
    paths:
      - "agenda-android/**"
      - ".github/workflows/agenda-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agenda-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Agenda.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Agenda-apk
          path: Agenda.apk

      # O pagina de Release cu APK-ul atasat: link public, se deschide direct de pe telefon.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: agenda-${{ github.run_number }}
          name: Agenda (widget calendar) - build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: Agenda.apk
          body: |
            Widget Android pentru Google Calendar. Descarca **Agenda.apk** de mai jos si instaleaza-l.
